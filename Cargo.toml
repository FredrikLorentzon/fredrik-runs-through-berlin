[package]
name = "fredrik-runs-through-berlin"
version = "0.1.0"
edition = "2024"
publish = false
rust-version = "1.88"
description = "Build tools for the animated map of Berlin runs."

[dependencies]
chrono = "0.4.45"
clap = { version = "4.6.8", features = ["derive"] }
csv = "1.4.0"
fitparser = "0.12.0"
flate2 = "1.1.11"
roxmltree = "0.21.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
